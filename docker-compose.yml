# =============================================================================
# AI-Consultassistent - Docker Compose (Schaalbare Productie)
# =============================================================================
#
# CPU-modus (macOS / testen zonder GPU):
#   docker compose --profile cpu up -d
#
# GPU-modus (productie):
#   docker compose up -d
#   docker compose up -d --scale worker=3
#
# Eerste keer:
#   1. cp .env.example .env && pas waarden aan
#   2. docker compose --profile cpu up -d
#   3. docker compose exec ollama-cpu ollama pull llama3.1:8b
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis (job queue + event bus + cache)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ca-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Ollama - Lokale LLM runtime (GPU - productie)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ca-ollama
    restart: unless-stopped
    profiles: ["gpu"]
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Ollama zonder GPU (CPU - macOS / testen)
  ollama-cpu:
    image: ollama/ollama:latest
    container_name: ca-ollama-cpu
    restart: unless-stopped
    profiles: ["cpu"]
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_NUM_PARALLEL: 1
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # API Gateway (FastAPI) - CPU build voor macOS
  # ---------------------------------------------------------------------------
  api-cpu:
    build:
      context: .
      dockerfile: services/Dockerfile.cpu
    container_name: ca-api
    restart: unless-stopped
    profiles: ["cpu"]
    env_file: .env
    environment:
      OLLAMA_HOST: http://ollama-cpu:11434
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
    ports:
      - "8001:8000"
    volumes:
      - audio_data:/data/audio
      - audit_data:/data/audit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # API Gateway (GPU - productie)
  api:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: ca-api-gpu
    restart: unless-stopped
    profiles: ["gpu"]
    env_file: .env
    environment:
      OLLAMA_HOST: http://ollama:11434
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
    ports:
      - "8000:8000"
    volumes:
      - audio_data:/data/audio
      - audit_data:/data/audit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Pipeline Worker (CPU - macOS / testen)
  # ---------------------------------------------------------------------------
  worker-cpu:
    build:
      context: .
      dockerfile: services/Dockerfile.cpu
    container_name: ca-worker-cpu
    restart: unless-stopped
    profiles: ["cpu"]
    env_file: .env
    environment:
      OLLAMA_HOST: http://ollama-cpu:11434
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      WHISPER_MODEL: ${WHISPER_MODEL_CPU:-small}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      DIARIZATION_ENABLED: "false"
    command: python -m services.worker.service
    volumes:
      - audio_data:/data/audio
      - model_cache:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-cpu:
        condition: service_healthy

  # Pipeline Worker (GPU - productie, schaalbaar)
  worker:
    build:
      context: .
      dockerfile: services/Dockerfile
    restart: unless-stopped
    profiles: ["gpu"]
    env_file: .env
    environment:
      OLLAMA_HOST: http://ollama:11434
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
    command: python -m services.worker.service
    volumes:
      - audio_data:/data/audio
      - model_cache:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # Cloud API - Chrome Extension Backend (geen GPU nodig)
  # ---------------------------------------------------------------------------
  cloud-api:
    build:
      context: .
      dockerfile: services/cloud_api/Dockerfile
    container_name: ca-cloud-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend/review-app
      dockerfile: Dockerfile
    container_name: ca-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
      NEXT_PUBLIC_APP_NAME: AI-Consultassistent
    ports:
      - "3000:3000"

  # ---------------------------------------------------------------------------
  # Cloud API (Chrome Extension Backend - geen GPU nodig)
  # ---------------------------------------------------------------------------
  cloud-api:
    build:
      context: .
      dockerfile: services/cloud_api/Dockerfile
    container_name: sv-cloud-api
    restart: unless-stopped
    profiles: ["cloud"]
    env_file: .env
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_models:
    driver: local
  audio_data:
    driver: local
  audit_data:
    driver: local
  model_cache:
    driver: local
