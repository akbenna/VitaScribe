<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VitaScribe</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <img class="logo" src="../icons/icon48.png" alt="VitaScribe">
        <h1>VitaScribe</h1>
      </div>
      <button id="btn-settings" class="btn-icon" title="Instellingen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </header>

    <!-- Status bar -->
    <div id="status-bar" class="status-bar hidden">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text"></span>
    </div>

    <!-- State: Idle (ready to record) -->
    <section id="state-idle" class="state">
      <div class="record-area">
        <label class="consent" style="display:flex;gap:6px;align-items:flex-start;font-size:12px;margin-bottom:10px;text-align:left;background:#fff7e6;border:1px solid #f0d9a8;border-radius:8px;padding:6px 8px;color:#6b4a00">
          <input type="checkbox" id="consent-recording"> Patiënt is geïnformeerd en geeft toestemming voor opname en AI-verslag
        </label>
        <button id="btn-start" class="btn-record" title="Start opname">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
        <p class="hint">Klik om consult op te nemen</p>
        <button id="btn-quick-dictate" class="btn btn-primary" style="margin-top:12px">Dicteer in veld (Alt+Shift+D)</button>
        <p class="hint" style="margin-top:4px">Klik eerst in het Bricks-veld</p>
        <button id="btn-dictate" class="btn btn-secondary" style="margin-top:8px">Zijpaneel openen</button>
        <button id="btn-letters" class="btn btn-secondary" style="margin-top:8px">Brief schrijven</button>
        <a href="#" id="link-map-fields" class="hint" style="display:block;margin-top:8px">S/O/E/P-velden in Bricks koppelen</a>
      </div>
    </section>

    <!-- State: Recording -->
    <section id="state-recording" class="state hidden">
      <div class="recording-area">
        <div class="recording-indicator">
          <span class="pulse-dot"></span>
          <span id="timer">00:00</span>
        </div>
        <canvas id="waveform" width="340" height="48"></canvas>
        <div class="recording-actions">
          <button id="btn-stop" class="btn btn-danger">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
            Stop &amp; verwerk
          </button>
        </div>
      </div>
    </section>

    <!-- State: Processing -->
    <section id="state-processing" class="state hidden">
      <div class="processing-area">
        <div class="spinner"></div>
        <p id="processing-step">Audio wordt verwerkt...</p>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>
    </section>

    <!-- State: Results -->
    <section id="state-results" class="state hidden">
      <div class="result-card result-decisief">
        <div class="result-header">
          <h3>Decisief regel</h3>
          <button id="btn-copy-decisief" class="btn-icon btn-copy" title="Kopieer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          </button>
        </div>
        <p id="decisief-text" class="decisief-text"></p>
      </div>

      <div class="result-card">
        <div class="result-header">
          <h3>SOEP-notitie</h3>
          <button id="btn-copy-soep" class="btn-icon btn-copy" title="Kopieer alles">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          </button>
        </div>
        <div class="soep-fields">
          <div class="soep-field"><label>S</label><p id="soep-s"></p></div>
          <div class="soep-field"><label>O</label><p id="soep-o"></p></div>
          <div class="soep-field"><label>E</label><p id="soep-e"></p></div>
          <div class="soep-field"><label>P</label><p id="soep-p"></p></div>
        </div>
        <div id="icpc-badge" class="icpc-badge hidden">
          <span id="icpc-code"></span>
          <span id="icpc-title"></span>
        </div>
        <p id="corrections-info" class="corrections-info hidden"></p>
      </div>

      <div class="result-actions">
        <button id="btn-push-bricks" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7-7 7 7"/></svg>
          Push naar Bricks
        </button>
        <button id="btn-new-consult" class="btn btn-secondary">Nieuw consult</button>
      </div>
    </section>

    <!-- State: Error -->
    <section id="state-error" class="state hidden">
      <div class="error-area">
        <p id="error-message"></p>
        <button id="btn-retry" class="btn btn-secondary">Opnieuw proberen</button>
      </div>
    </section>
  </div>

  <script src="../lib/praktijk.js"></script>
  <script src="../lib/instellingen.js"></script>
  <script src="popup.js"></script>
</body>
</html>
