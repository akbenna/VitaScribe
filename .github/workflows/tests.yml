name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vs
          POSTGRES_PASSWORD: vs
          POSTGRES_DB: vitascribe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vs" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://vs:vs@localhost:5432/vitascribe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tests/requirements-cloud.txt
      - name: Cloud API (dicteren, SOEP, brieven, AVG-beleid)
        run: >
          pytest -q tests/test_cloud_dictation.py tests/test_cloud_pipeline.py
          tests/test_cloud_letters.py tests/test_cloud_policy.py tests/test_vocabulary.py
          tests/test_cloud_thuisarts.py tests/test_cloud_extension_download.py
          tests/test_pack_extension.py tests/test_cloud_register.py tests/test_cloud_consult_live.py
          tests/test_cloud_vraagsuggesties.py tests/test_cloud_dossiervraag.py tests/test_cloud_meedenken.py tests/test_cloud_post.py
          tests/test_cloud_bedrock.py tests/test_cloud_spraaktest.py tests/test_cloud_modus.py tests/test_cloud_soeptest.py tests/test_cloud_tolk.py tests/test_cloud_leren.py tests/test_cloud_econsult.py tests/test_cloud_telefoon.py tests/test_cloud_modusslot.py

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntaxcontrole
        run: for f in chrome-extension/*/*.js; do node --check "$f"; done
      - name: Koppeltabel Thuisarts, QR en praktijknummer (node --test)
        run: node --test tests/js/thuisarts.test.js tests/js/praktijk.test.js tests/js/consult-live.test.js tests/js/dossiervraag.test.js tests/js/post.test.js tests/js/gevoelig.test.js tests/js/tolk.test.js tests/js/leren.test.js tests/js/econsult.test.js tests/js/brief.test.js tests/js/privacy.test.js
      - run: npm install --no-save playwright@1.56 && npx playwright install --with-deps chromium
      - name: End-to-end in Chromium (nagebootst Bricks, gesimuleerde server)
        run: node tests/e2e/extension.e2e.js
      - name: Consultopname van A tot Z (nep-microfoon, gesimuleerde server)
        run: node tests/e2e/consult.e2e.js
      - name: Koppeltabel ProVita Care (node --test)
        run: node --test tests/js/beslistools.test.js
